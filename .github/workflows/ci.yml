name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Supabase local (supabase start): valores públicos e fixos da CLI, não são segredos.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      TMDB_READ_TOKEN: token-ci
      # TMDB falso dos testes E2E (tests/e2e/tmdb-falso), subido pelo Playwright.
      TMDB_API_URL: http://127.0.0.1:4010/3
      # Pôsteres falsos nos E2E: sem otimizador de imagens (ver next.config.ts).
      IMAGENS_SEM_OTIMIZACAO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o gitleaks varre todo o histórico, e a cobertura das linhas novas
          # usa o git diff contra a main e contra o 4ac8b98.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Versão fixa, a mesma do `supabase` no lockfile: com `latest`, a action consulta a API do
      # GitHub para resolver a versão e falha quando bate no limite de requisições.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Duplicação do código (critério da AP2: até 5%). Configuração em .jscpd.json.
      - run: pnpm check:duplicacao
      # Segredos em todo o histórico do commit testado (critério da AP2: zero). Binário oficial,
      # com versão e checksum fixos. Falsos positivos conhecidos em .gitleaks.toml.
      - name: gitleaks
        env:
          VERSAO: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          arquivo="gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${arquivo}"
          echo "${SHA256}  $RUNNER_TEMP/$arquivo" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="HEAD" .
      # Alertas críticos de dependência (critério da AP2: zero).
      - run: pnpm audit --audit-level critical
      - run: pnpm test:coverage
      # Cobertura das linhas novas deste PR e de toda a AP2 (desde o 4ac8b98), no resumo do job.
      # Só avisa abaixo de 70%, sem reprovar: a medição só enxerga os testes unitários.
      - run: pnpm coverage:diff origin/main 4ac8b98
      # Só os serviços que o app usa, para subir mais rápido.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,mailpit,supavisor
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm check:secrets
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
